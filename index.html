<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZeroComplicazioni</title>
<meta name="description" content="ZeroComplicazioni — strumenti e consulenza per ristoranti, pizzerie e attività di ristorazione. Ordini online, processi, food cost.">
<meta name="robots" content="noindex">
<meta property="og:title" content="ZeroComplicazioni">
<meta property="og:description" content="Strumenti e consulenza per chi lavora con asporto e consegna.">
<meta property="og:type" content="website">
<link rel="icon" href="favicon.ico" sizes="any">
<style>
  :root{
    --ink:#1E1E1E;
    --coral:#F27F6B;
    --cream:#FDF0D4;
    --muted:#6B6660;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:var(--cream);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    padding:32px 24px;
    text-align:center;
  }
  .wrap{max-width:520px}
  .mark{width:88px;height:88px;margin:0 auto 32px;display:block}
  h1{
    font-size:clamp(28px,7vw,42px);
    font-weight:700;
    letter-spacing:-0.02em;
    margin-bottom:18px;
  }
  h1 .zero{color:var(--coral)}
  p.lead{
    font-size:clamp(15px,4vw,18px);
    line-height:1.6;
    color:var(--muted);
    margin-bottom:34px;
  }
  .soon{
    display:inline-block;
    font-size:13px;
    letter-spacing:0.12em;
    text-transform:uppercase;
    color:var(--coral);
    border:1.5px solid var(--coral);
    border-radius:999px;
    padding:9px 20px;
    margin-bottom:34px;
  }
  .contact{font-size:15px;color:var(--muted)}
  .contact a{color:var(--ink);text-decoration:none;border-bottom:1.5px solid var(--coral)}
  .contact a:hover{color:var(--coral)}
  footer{
    margin-top:48px;
    font-size:12px;
    color:#A39C92;
  }
</style>
</head>
<body>
  <div class="wrap">

    <svg class="mark" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="ZeroComplicazioni">
      <path d="M 73.641 87.109 A 44 44 0 1 1 93.958 51.919 L 75.975 51.134 A 26 26 0 1 0 63.970 71.928 Z" fill="#F27F6B"/>
    </svg>

    <h1><span class="zero">Zero</span>Complicazioni</h1>

    <p class="lead">
      Strumenti e consulenza per ristoranti, pizzerie e attività
      che lavorano con asporto e consegna.
    </p>

    <div class="soon">Sito in arrivo</div>

    <p class="contact">
      Nel frattempo scrivimi:
      <a href="mailto:info@zerocomplicazioni.it">info@zerocomplicazioni.it</a>
    </p>

    <footer>© 2026 ZeroComplicazioni</footer>

  </div>
</body>
</html>
